<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Gestor de Gastos</title>
</head>

<body>

    <a href="../../index.html">&larr; Volver</a>

    <h1>Gestor de Gastos</h1>

    <h2>Agregar gasto</h2>

    <label>Categoría:</label>
    <input type="text" id="categoria">

    <br><br>

    <label>Monto:</label>
    <input type="text" id="monto">

    <br><br>

    <button onclick="agregarGasto()">Agregar gasto</button>

    <h2>Gastos registrados</h2>

    <div id="resultado"></div>

    <h2>Total de gastos</h2>

    <button onclick="calcularTotal()">Calcular total</button>

    <p id="total"></p>

    <h2>Total por categoría</h2>

    <label>Categoría:</label>
    <input type="text" id="categoriaTotal">

    <button onclick="totalPorCategoria()">Calcular</button>

    <p id="resultadoCategoria"></p>

    <h2>Categoría con mayor gasto</h2>

    <button onclick="mayorGasto()">Buscar mayor gasto</button>

    <p id="mayor"></p>

    <h2>Filtrar gastos</h2>

    <label>Gastos mayores a:</label>
    <input type="text" id="filtro">

    <button onclick="filtrarGastos()">Filtrar</button>

    <p id="resultadoFiltro"></p>

    <script src="script.js"></script>

</body>

</html>
